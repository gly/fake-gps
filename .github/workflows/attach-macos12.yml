# 把 macos-12 分支 CI 产出的 Intel/Monterey 兼容包，附加到 v1.1.1 Release。
#
# 注意：标签触发的构建运行，其 head_branch 是标签名（如 v1.1.1-macos12），
# 不能按分支名过滤——这里改按产物名（FakeGPS-macos-x86_64-macos12）查找
# 最新的未过期产物，用产物 ID 下载后上传到 Release。
#
# 触发：手动（workflow_dispatch）或本文件变更推送到 master 时自动执行。

name: Attach macOS 12 package to release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/attach-macos12.yml"]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Find newest macos12 artifact
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=FakeGPS-macos-x86_64-macos12" \
            --jq '.artifacts | map(select(.expired == false))[0].id // empty')
          if [ -z "$AID" ]; then
            echo "没有找到 FakeGPS-macos-x86_64-macos12 产物" >&2
            exit 1
          fi
          echo "Using artifact id: $AID"
          echo "artifact_id=$AID" >> "$GITHUB_OUTPUT"

      - name: Download package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ steps.find.outputs.artifact_id }}/zip" \
            > dist/artifact.zip
          unzip -o dist/artifact.zip -d dist
          ls -la dist

      - name: Upload to release v1.1.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.1.1 dist/FakeGPS-macos-x86_64-macos12.zip \
            --repo ${{ github.repository }} --clobber
