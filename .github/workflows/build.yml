# macOS 12 兼容分支（macos-12）专用：只在 Intel runner 上构建 x86_64 包，
# 部署目标 macOS 12（Monterey）。master 分支的 build.yml 与此不同。
#
# 触发方式：手动（workflow_dispatch，需选择本分支）或在本分支上推送 v* 标签。
# 产物：FakeGPS-macos-x86_64-macos12.zip（Actions Artifacts / Release）。

name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15-intel # 最后一代 Intel runner（x86_64）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Python engine
        run: |
          ./setup.sh
          ~/.ios-fake-gps/venv/bin/pip install pyinstaller

      - name: Build app (x86_64, macOS 12+)
        run: ./scripts/build_app.sh

      - name: Rename zip for macOS 12 legacy tag
        run: mv dist/FakeGPS-macos-x86_64.zip dist/FakeGPS-macos-x86_64-macos12.zip

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: FakeGPS-macos-x86_64-macos12
          path: dist/FakeGPS-macos-x86_64-macos12.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FakeGPS-macos-x86_64-macos12
          path: dist
          merge-multiple: true

      # 注意：本分支不清空旧 release（master 的 build.yml 会清理）。
      - uses: softprops/action-gh-release@v2
        with:
          name: FakeGPS ${{ github.ref_name }} (macOS 12 Intel)
          files: dist/FakeGPS-macos-x86_64-macos12.zip
          body: |
            ## 下载（Intel 芯片 · macOS 12 Monterey 兼容版）

            | 芯片 | 下载 |
            | --- | --- |
            | Intel | [FakeGPS-macos-x86_64-macos12.zip](https://github.com/gly/fake-gps/releases/download/${{ github.ref_name }}/FakeGPS-macos-x86_64-macos12.zip) |

            此包基于 `macos-12` 兼容分支构建，部署目标 macOS 12（Monterey）。
            如果 macOS 提示“来自身份不明的开发者”，请右键应用 → 打开，或运行
            `xattr -dr com.apple.quarantine /Applications/FakeGPS.app`。

            **完整更新日志**：https://github.com/gly/fake-gps/commits/${{ github.ref_name }}
