# 分架构打包：分别在 Apple silicon（arm64）和 Intel（x86_64）runner 上构建。
#
# PyInstaller 不支持交叉编译，所以引擎必须在对应架构的机器上冻结。
# 触发方式：手动（workflow_dispatch）或推送 v* 标签。
# 产物：FakeGPS-macos-arm64.zip / FakeGPS-macos-x86_64.zip（Actions Artifacts）；
# 推送 v* 标签时还会自动创建 Release 并上传这两个 zip。
#
# 说明：GitHub 已退役 macos-13/14 标签；Apple silicon 用 macos-15，
# Intel 用 macos-15-intel（GitHub 提供的最后一代 Intel 机器）。
#
# 注意：Gitee 没有免费的 macOS 云构建机。把仓库镜像到 GitHub 后本 workflow
# 即可直接使用；或在任意 Intel Mac 上手动运行 ./scripts/build_app.sh。

name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple silicon（arm64）
            arch: arm64
          - os: macos-15-intel # 最后一代 Intel runner（x86_64）
            arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Python engine
        run: |
          ./setup.sh
          ~/.ios-fake-gps/venv/bin/pip install pyinstaller

      - name: Build app (${{ matrix.arch }})
        run: ./scripts/build_app.sh

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: FakeGPS-macos-${{ matrix.arch }}
          path: dist/FakeGPS-macos-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FakeGPS-macos-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: FakeGPS ${{ github.ref_name }}
          files: dist/FakeGPS-macos-*.zip
          body: |
            ## 下载

            | 芯片 | 下载 |
            | --- | --- |
            | Apple silicon（M1/M2/M3/M4） | [FakeGPS-macos-arm64.zip](https://github.com/gly/fake-gps/releases/download/${{ github.ref_name }}/FakeGPS-macos-arm64.zip) |
            | Intel | [FakeGPS-macos-x86_64.zip](https://github.com/gly/fake-gps/releases/download/${{ github.ref_name }}/FakeGPS-macos-x86_64.zip) |

            如果 macOS 提示“来自身份不明的开发者”，请右键应用 → 打开，或运行
            `xattr -dr com.apple.quarantine /Applications/FakeGPS.app`。

            **完整更新日志**：https://github.com/gly/fake-gps/commits/${{ github.ref_name }}
