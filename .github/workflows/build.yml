# 分架构打包：分别在 Apple silicon（arm64）和 Intel（x86_64）runner 上构建。
#
# PyInstaller 不支持交叉编译，所以引擎必须在对应架构的机器上冻结。
# 触发方式：手动（workflow_dispatch）或推送 v* 标签。
# 产物：FakeGPS-macos-arm64.zip / FakeGPS-macos-x86_64.zip（Actions Artifacts）；
# 推送 v* 标签时还会自动创建 Release 并上传这两个 zip。
#
# 说明：GitHub 已退役 macos-13/14 标签；Apple silicon 用 macos-15，
# Intel 用 macos-15-intel（GitHub 提供的最后一代 Intel 机器）。
#
# 注意：Gitee 没有免费的 macOS 云构建机。把仓库镜像到 GitHub 后本 workflow
# 即可直接使用；或在任意 Intel Mac 上手动运行 ./scripts/build_app.sh。

name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple silicon（arm64）
            arch: arm64
          - os: macos-15-intel # 最后一代 Intel runner（x86_64）
            arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Python engine
        run: |
          ./setup.sh
          ~/.ios-fake-gps/venv/bin/pip install pyinstaller

      - name: Build app (${{ matrix.arch }})
        run: ./scripts/build_app.sh

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: FakeGPS-macos-${{ matrix.arch }}
          path: dist/FakeGPS-macos-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 按需求：发布新版本前清空所有旧 release（连同对应的 git tag）。
      - name: Remove previous releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --repo ${{ github.repository }} \
                       --json tagName -q '.[].tagName' \
                       | grep -v "^${{ github.ref_name }}$"); do
            echo "Deleting old release/tag: $tag"
            gh release delete "$tag" --repo ${{ github.repository }} --yes --cleanup-tag
          done

      - uses: actions/download-artifact@v4
        with:
          pattern: FakeGPS-macos-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: FakeGPS ${{ github.ref_name }}
          files: dist/FakeGPS-macos-*.zip
          body: |
            ## 下载

            | 芯片 | 下载 |
            | --- | --- |
            | Apple silicon（M1/M2/M3/M4） | [FakeGPS-macos-arm64.zip](https://github.com/gly/fake-gps/releases/download/${{ github.ref_name }}/FakeGPS-macos-arm64.zip) |
            | Intel | [FakeGPS-macos-x86_64.zip](https://github.com/gly/fake-gps/releases/download/${{ github.ref_name }}/FakeGPS-macos-x86_64.zip) |
            | Intel（旧系统，macOS 12 Monterey） | [FakeGPS-macos-x86_64-macos12.zip](https://github.com/gly/fake-gps/releases/download/${{ github.ref_name }}/FakeGPS-macos-x86_64-macos12.zip) |

            如果 macOS 提示“来自身份不明的开发者”，请右键应用 → 打开，或运行
            `xattr -dr com.apple.quarantine /Applications/FakeGPS.app`。

            **完整更新日志**：https://github.com/gly/fake-gps/commits/${{ github.ref_name }}

      - name: Wait for macos-12 build and attach legacy package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 等待 macos-12 分支（由 v1.1.1-macos12 标签触发）出现本次发布后的
          # 成功构建（最多 25 分钟），然后把兼容包附加到本 Release。
          MASTER_CREATED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at)
          RUN_ID=""
          for i in $(seq 1 50); do
            LATEST=$(gh run list --repo ${{ github.repository }} \
              --branch macos-12 --workflow "Build macOS app" --status success \
              --limit 1 --json databaseId,createdAt \
              -q '.[0] | (.databaseId | tostring) + " " + .createdAt' || true)
            RID="${LATEST%% *}"; CREATED="${LATEST#* }"
            if [ -n "$RID" ] && [[ "$CREATED" > "$MASTER_CREATED" ]]; then
              RUN_ID="$RID"
              echo "found macos-12 run: $RUN_ID"
              break
            fi
            sleep 30
          done
          if [ -z "$RUN_ID" ]; then
            echo "macos-12 分支尚无本次发布后的成功构建，跳过附加兼容包"
            exit 0
          fi
          gh run download "$RUN_ID" --repo ${{ github.repository }} \
            --name FakeGPS-macos-x86_64-macos12 --dir macos12
          gh release upload "${{ github.ref_name }}" macos12/FakeGPS-macos-x86_64-macos12.zip \
            --repo ${{ github.repository }} --clobber
